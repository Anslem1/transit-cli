name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Tests
        run: go test -v ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    needs: goreleaser
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Checkout Homebrew Tap Repo
        uses: actions/checkout@v4
        with:
          repository: Anslem1/homebrew-tap
          token: ${{ secrets.GH_TOKEN }}

      - name: Get Release Tag
        id: release_info
        run: |
          tag=$(gh release view --repo Anslem1/transit-cli --json tagName -q .tagName)
          echo "RELEASE_TAG=$tag" >> $GITHUB_ENV

      - name: Fetch checksums
        run: |
          checksums_url="https://github.com/Anslem1/transit-cli/releases/download/${RELEASE_TAG}/transit-cli_${RELEASE_TAG}_checksums.txt"
          curl -sL "${checksums_url}" -o checksums.txt

      - name: Parse checksums
        run: |
          echo "SHA_DARWIN_AMD64=$(grep 'darwin_amd64' checksums.txt | cut -d ' ' -f 1)" >> $GITHUB_ENV
          echo "SHA_DARWIN_ARM64=$(grep 'darwin_arm64' checksums.txt | cut -d ' ' -f 1)" >> $GITHUB_ENV
          echo "SHA_LINUX_AMD64=$(grep 'linux_amd64' checksums.txt | cut -d ' ' -f 1)" >> $GITHUB_ENV
          echo "SHA_LINUX_ARM64=$(grep 'linux_arm64' checksums.txt | cut -d ' ' -f 1)" >> $GITHUB_ENV

      - name: Update Homebrew Formula
        run: |
          mkdir -p Formula
          {
            echo "class TransitCli < Formula"
            echo "  desc \"Transit is an interactive CLI tool designed to streamline developer workflows with sequential and concurrent command execution.\""
            echo "  homepage \"https://github.com/Anslem1/transit-cli\""
            echo "  if OS.mac? && Hardware::CPU.intel?"
            echo "    url \"https://github.com/Anslem1/transit-cli/releases/download/${RELEASE_TAG}/transit-cli_${RELEASE_TAG}_darwin_amd64.tar.gz\""
            echo "    sha256 \"${SHA_DARWIN_AMD64}\""
            echo "  elsif OS.mac? && Hardware::CPU.arm?"
            echo "    url \"https://github.com/Anslem1/transit-cli/releases/download/${RELEASE_TAG}/transit-cli_${RELEASE_TAG}_darwin_arm64.tar.gz\""
            echo "    sha256 \"${SHA_DARWIN_ARM64}\""
            echo "  elsif OS.linux? && Hardware::CPU.intel?"
            echo "    url \"https://github.com/Anslem1/transit-cli/releases/download/${RELEASE_TAG}/transit-cli_${RELEASE_TAG}_linux_amd64.tar.gz\""
            echo "    sha256 \"${SHA_LINUX_AMD64}\""
            echo "  elsif OS.linux? && Hardware::CPU.arm?"
            echo "    url \"https://github.com/Anslem1/transit-cli/releases/download/${RELEASE_TAG}/transit-cli_${RELEASE_TAG}_linux_arm64.tar.gz\""
            echo "    sha256 \"${SHA_LINUX_ARM64}\""
            echo "  end"
            echo "  def install"
            echo "    bin.install \"transit-cli\" => \"transit\""
            echo "  end"
            echo "  test do"
            echo "    system \"#{bin}/transit\", \"version\""
            echo "  end"
            echo "end"
          } > Formula/transit-cli.rb

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Homebrew formula for ${{ env.RELEASE_TAG }}"
          branch: main
          file_pattern: Formula/transit-cli.rb
